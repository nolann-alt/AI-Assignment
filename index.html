<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const info = document.getElementById("info"); // Get the score zone
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        const generateFood = () => {
            let newFood;

            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (
                // Keep generating food while it overlaps the snake
                snake.some((segment) => {
                    return segment.x === newFood.x &&
                        segment.y === newFood.y;
                })
            );

            return newFood;
        };
        let direction = { x: 1, y: 0 };
        // Generate a random position for the apple
        let food = generateFood();
        let score = 0;
        let gameOver = false;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame(); 

        // ===== MOVING THE SNAKE =====
        const moveSnake = () => {
            if (gameOver) {
                return;
            }

            // The snake's old head
            const oldHead = snake[0];

            // Calculate the new head
            const newHead = {
                x: oldHead.x + direction.x,
                y: oldHead.y + direction.y
            };

            gameOverLogic(newHead);
            if (gameOver) {
                return;
            }

            // When the snake will eat an apple, it will growth as well
            snake.unshift(newHead); // Place the new head at index 0

            eatingAndGrowing(newHead);

            drawGame();
        };

        setInterval(moveSnake, 200);

        // ===== Keyboard controls =====
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") {
                changeDirection({ x: 0, y: -1 });
            } else if (event.key === "ArrowDown") {
                changeDirection({ x: 0, y: 1 });
            } else if (event.key === "ArrowLeft") {
                changeDirection({ x: -1, y: 0 });
            } else if (event.key === "ArrowRight") {
                changeDirection({ x: 1, y: 0 });
            }
        });
        // This function prevent the snake against colide itself unexpectedly
        const changeDirection = (newDirection) => {
            if (direction.x + newDirection.x !== 0 || direction.y + newDirection.y !== 0) {
                direction = newDirection;
            }
        };

        // ===== Eating and growing =====
        const eatingAndGrowing = (newHead) => {
            if (newHead.x === food.x && newHead.y === food.y) {
                // Generate a new random position for the apple into the game area
                food = generateFood();
                
                // Increasing the score
                score++;
                info.textContent = "Score: " + score; // Display on the screen the score
                
            } else {
                snake.pop(); // removes the last segment
            }
        }

        // ===== Game over =====
        const gameOverLogic = (newHead) => {
            // Checking wall colision
            if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
                endGame();
            } else if (hitsSnake(newHead)) {
                endGame();
            }
        }
        // Looking if the new head correspond to a segment in the snake array
        const hitsSnake = (newHead) => {
            return snake.some((segment) => {
                return segment.x === newHead.x && segment.y === newHead.y;
            });
        };

        // Function to end the game, endgame is called when the game need to be over
        const endGame = () => {
            gameOver = true;
            info.textContent = "Game over! Score: " + score;
        };
    

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
