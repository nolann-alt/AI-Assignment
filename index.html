<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="game">
        <h1>Snake</h1>
        <p id="info">Score: 0 | Highest score: 0</p>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="btn">
            <button id="restartButton">Restart</button>
            <button id="pauseButton">Pause</button>
            <button id="resetButton">Reset Highest Score</button>
        </div>
        
    </main>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const info = document.getElementById("info"); // Get the score zone
        const restartButton = document.getElementById("restartButton");
        const resetButton = document.getElementById("resetButton");
        const pauseButton = document.getElementById("pauseButton");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let isPaused = false;
        let gameSpeed = 150; // Speed of the game
        let gameTimer;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        const generateFood = () => {
            let newFood;

            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (
                // Keep generating food while it overlaps the snake
                snake.some((segment) => {
                    return segment.x === newFood.x &&
                        segment.y === newFood.y;
                })
            );

            return newFood;
        };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let canTurn = true;
        // Generate a random position for the apple
        let food = generateFood();
        let score = 0;
        let highestScore = Number(localStorage.getItem("snakeHighestScore")) || 0; // Retrives the highest score stored in local storage
        let gameOver = false;

        // This function lets you know which corner round
        const endCorners = (dx, dy) => {
            if (dx === 1) return [0, 6, 6, 0];
            if (dx === -1) return [6, 0, 0, 6];
            if (dy === 1) return [0, 0, 6, 6];
            return [6, 6, 0, 0];
        };

        // This function return the correct position of the snake eyes depending on the snake position
        const eyesPosition = (dx, dy) => {
            if (dx === 1) return [[14, 6], [14, 14]];
            if (dx === -1) return [[6, 6], [6, 14]];
            if (dy === 1) return [[6, 14], [14, 14]];
            return [[6, 6], [14, 6]];
        };

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.beginPath();
            // Round the apple
            ctx.roundRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize,
                12
            );
            ctx.fill(); // Fills the current drawing path with the current dillStyle coulur

            ctx.fillStyle = "black";
            // Rounding the first and the last element of the snake body
            snake.forEach((segment, index) => {
                const isHead = index === 0; // If it's the head
                const isTail = index === snake.length - 1; // If it's the last element of the snake

                // Only change the color of the head if it is the generated head
                ctx.fillStyle = isHead ? "#EF4135" : "#101820";
                
                // Select the correct corner to round 
                let corners;
                if (isHead) {
                    corners = endCorners(direction.x, direction.y)
                } else if (isTail) {
                    const previous = snake[index - 1];
                    const tailDirection = {
                        x: segment.x - previous.x,
                        y: segment.y - previous.y
                    };
                    corners = endCorners(tailDirection.x, tailDirection.y)
                }
                
                // Round the corners only if its the head or the tail
                if (isHead || isTail) {
                    ctx.beginPath();
                    ctx.roundRect(
                        segment.x * gridSize,
                        segment.y * gridSize,
                        gridSize,
                        gridSize,
                        corners // Round the corners
                    );
                    ctx.fill();
                } else {
                    ctx.fillRect(
                        segment.x * gridSize,
                        segment.y * gridSize,
                        gridSize,
                        gridSize,
                    );
                }
                
                // Draw the snake eyes
                const head = snake[0];
                const eyes = eyesPosition(direction.x, direction.y);

                ctx.fillStyle = "black";

                // Draw the eyes using the correct coordinates
                for (const [x, y] of eyes) {
                    ctx.beginPath();
                    ctx.arc(
                        head.x * gridSize + x,
                        head.y * gridSize + y,
                        2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            });
        };

        drawGame(); 

        // ===== MOVING THE SNAKE =====
        const moveSnake = () => {
            if (gameOver) {
                return;
            }

            direction = nextDirection;
            canTurn = true;

            // The snake's old head
            const oldHead = snake[0];

            // Calculate the new head
            const newHead = {
                x: oldHead.x + direction.x,
                y: oldHead.y + direction.y
            };

            gameOverLogic(newHead);
            if (gameOver) {
                return;
            }

            // When the snake will eat an apple, it will growth as well
            snake.unshift(newHead); // Place the new head at index 0

            eatingAndGrowing(newHead);

            drawGame();
        };

        // Starting the game timer with a game speed
        const startGameTimer = () => {
            gameTimer = setInterval(moveSnake, gameSpeed)
        }
        startGameTimer();

        // ===== Keyboard controls =====
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") {
                changeDirection({ x: 0, y: -1 });
            } else if (event.key === "ArrowDown") {
                changeDirection({ x: 0, y: 1 });
            } else if (event.key === "ArrowLeft") {
                changeDirection({ x: -1, y: 0 });
            } else if (event.key === "ArrowRight") {
                changeDirection({ x: 1, y: 0 });
            }
        });
        // This function prevent the snake against colide itself unexpectedly and add a queue to avoid fast key presses
        const changeDirection = (newDirection) => {
            if(!canTurn) {
                return;
            }

            if (direction.x + newDirection.x === 0 && direction.y + newDirection.y === 0) {
                return;
            }
            
            nextDirection = newDirection;
            canTurn = false;
        };

        // ===== Eating and growing =====
        const eatingAndGrowing = (newHead) => {
            if (newHead.x === food.x && newHead.y === food.y) {
                // Generate a new random position for the apple into the game area
                food = generateFood();
                
                // Increasing the score
                score++;
                
                // Update the highestScore variable if score is higher than the current score
                if (score > highestScore) {
                    highestScore = score
                    localStorage.setItem("snakeHighestScore", highestScore);
                }

                info.textContent = "Score: " + score + " | Highest score: " + highestScore; // Display on the screen the score

                // Each apple increase the speed by reducing the interval by 10 milliseconds until it reaches 50 milliseconds
                gameSpeed = Math.max(50, 150 - score * 10);
                clearInterval(gameTimer); // We clear the gameTimer to change it by the new one
                startGameTimer();
                
            } else {
                snake.pop(); // removes the last segment
            }
        }

        // ===== Game over =====
        const gameOverLogic = (newHead) => {
            // Checking wall colision
            if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
                endGame();
            } else if (hitsSnake(newHead)) {
                endGame();
            }
        }
        // Looking if the new head correspond to a segment in the snake array
        const hitsSnake = (newHead) => {
            return snake.some((segment) => {
                return segment.x === newHead.x && segment.y === newHead.y;
            });
        };

        // Function to end the game, endgame is called when the game need to be over
        const endGame = () => {
            gameOver = true;
            info.textContent = "Game over! Score: " + score + " | Highest score: " + highestScore;
        };

        // Pause the game
        const pauseGame = () => {
            if (gameOver) {
                return;
            }

            isPaused = true;
            clearInterval(gameTimer);
            pauseButton.textContent = "Resume";
            info.textContent = "Paused | Score: " + score + " | Highest score: " + highestScore;
        };

        // Resume the game
        const resumeGame = () => {
            isPaused = false;
            startGameTimer();
            pauseButton.textContent = "Pause";
            info.textContent = "Score: " + score + " | Highest score: " + highestScore;
        };

        // Restart the game with all the variables at their default values
        const restartGame = () => {
            clearInterval(gameTimer);

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            canTurn = true;
            food = generateFood();
            score = 0;
            gameSpeed = 150;
            gameOver = false;
            isPaused = false;
            pauseButton.textContent = "Pause";  

            info.textContent = "Score: 0 | Highest score: " + highestScore;
            drawGame();
            startGameTimer();
        };

        // Button for restarting the game
        restartButton.addEventListener("click", () => {
            restartGame();
        });

         // Button to reset the highest score
        resetButton.addEventListener("click", () => {
            highestScore = 0;
            localStorage.setItem("snakeHighestScore", highestScore);
            console.log(localStorage.getItem("snakeHighestScore"))
            info.textContent = "Score: " + score + " | Highest score: " + highestScore;
        });

        // Button pause logic
        pauseButton.addEventListener("click", () => {
            if (isPaused) {
                resumeGame();
            } else {
                pauseGame();
            }
        });
    </script>

</body>
</html>
